name: ci

on:
  push:
    branches:
      - main
      - 'rebuild/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    # The whole job is about a minute of compute (pytest 2 s, evaluate --seeds
    # 500 21 s, the 100-seed gamma sweep 23 s, audit --seeds 200 4 s,
    # measured). The cap is the ten-minute budget the README states.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --upgrade pip 2>&1 | tee -a ci.log
          # Install the way the README tells a reader to: the exact versions
          # pinned in requirements.lock (compiled from requirements.txt).
          python -m pip install -r requirements.lock 2>&1 | tee -a ci.log
          python -c "import numpy, pytest; print('numpy', numpy.__version__, 'pytest', pytest.__version__)" 2>&1 | tee -a ci.log

      - name: Tests
        shell: bash
        run: |
          python -m pytest -q 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}

      - name: Evaluate (500 paired seeds, four arms)
        shell: bash
        run: |
          echo "== evaluate.py --seeds 500 :: $(date -u +%FT%TZ)" | tee -a ci.log
          python evaluate.py --seeds 500 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}

      - name: Gamma sweep (100 paired seeds)
        shell: bash
        run: |
          echo "== evaluate.py --seeds 100 --gamma-sweep :: $(date -u +%FT%TZ)" | tee -a ci.log
          python evaluate.py --seeds 100 --gamma-sweep 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}

      - name: Audit the old notebook model (200 paired seeds)
        shell: bash
        run: |
          echo "== audit.py --seeds 200 :: $(date -u +%FT%TZ)" | tee -a ci.log
          python audit.py --seeds 200 2>&1 | tee -a ci.log; rc=${PIPESTATUS[0]}
          echo "== done :: $(date -u +%FT%TZ)" | tee -a ci.log
          exit $rc

      # The three steps above rewrite the four artifacts in the working tree.
      # This compares them with the committed copies and fails on any
      # difference (floats beyond a relative 1e-9, or any discrete field).
      - name: Check regenerated artifacts against the committed copies
        shell: bash
        run: |
          echo "== check_artifacts.py :: $(date -u +%FT%TZ)" | tee -a ci.log
          python scripts/check_artifacts.py 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}

      - name: Upload the log and regenerated artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-failure-attempt-${{ github.run_attempt }}
          path: |
            ci.log
            results.json
            results_seeds.csv
            results_sweep.json
            audit_results.json
          if-no-files-found: ignore
          retention-days: 14
